name: Build Windows release with Nuitka

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          } elseif (Test-Path "pyproject.toml") {
            python -m pip install .
          } else {
            Write-Warning "No requirements.txt or pyproject.toml found. Installing PySide6 only."
            python -m pip install PySide6
          }

          python -m pip install Nuitka ordered-set zstandard

      - name: Compile with Nuitka
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --mingw64 `
            --assume-yes-for-downloads `
            --windows-icon-from-ico=icon.ico `
            --output-filename=VHDX-Ventoy-Creator-Manager.exe `
            main.py

      - name: Prepare release asset
        id: asset
        shell: pwsh
        run: |
          $source = Get-ChildItem -Path . -Filter "VHDX-Ventoy-Creator-Manager.exe" -Recurse |
            Select-Object -First 1

          if (-not $source) {
            throw "Compiled executable not found."
          }

          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
          } else {
            $tag = "manual-${{ github.run_number }}"
          }

          $safeTag = $tag -replace '[^0-9A-Za-z._-]', '-'
          $assetName = "VHDX-Ventoy-Creator-Manager-$safeTag-Windows-x64.exe"
          Copy-Item $source.FullName $assetName

          "path=$assetName" >> $env:GITHUB_OUTPUT
          "name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Upload executable to GitHub release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "${{ steps.asset.outputs.path }}" --clobber

      - name: Upload executable as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.asset.outputs.name }}
          path: ${{ steps.asset.outputs.path }}
          if-no-files-found: error
          retention-days: 14
